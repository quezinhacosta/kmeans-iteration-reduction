name: CI - Applications & Experiments

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  applications-and-experiments:
    name: Run Application Tests and Experiment Pipelines
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Run Application Unit Tests
        env:
          PYTHONPATH: src
        run: |
          python -m unittest tests/test_applications.py

      - name: Run Benchmark Experiment Comparison Script
        env:
          PYTHONPATH: src
        run: |
          python experiments/run_comparison.py
