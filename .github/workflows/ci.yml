name: CI - Test Suite & Code Quality

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test:
    name: Test on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e .

      - name: Lint Code with Flake8
        run: |
          # Checa erros de sintaxe e imports não utilizados (warning level)
          flake8 src tests experiments --count --select=E9,F63,F7,F82 --show-source --statistics
          # Estatísticas gerais de estilo (PEP8)
          flake8 src tests experiments --count --exit-zero --max-complexity=10 --max-line-length=120 --statistics

      - name: Run Full Test Suite with Unittest
        env:
          PYTHONPATH: src
        run: |
          python -m unittest discover tests -v

      - name: Run Tests with Pytest and Coverage
        run: |
          pytest --cov=kmeans_reduction tests/ --cov-report=term-missing

